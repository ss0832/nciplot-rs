[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "tools.build_backend"
backend-path = ["."]

[project]
name = "nciplot-rs-python"
dynamic = ["version"]
description = "Real-space NCI, IGM, and IGMH analysis and offline molecular visualization"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ss0832", email = "highlighty876@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.scripts]
nciplot-rs = "nciplot_rs:cli_main"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
python-source = "python"
module-name = "nciplot_rs._native"
exclude = [
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/*.log",
    "python/nciplot_rs/*.dll",
    "python/nciplot_rs/*.pyd",
    "python/nciplot_rs/*.so",
    "target*/**",
    ".venv/**",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
filterwarnings = ["error"]
